<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policyholder Account Registration | Cyber Liability Insurance Broker</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="shortcut icon" href="assets/images/favicon.svg">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="assets/css/index.css">

  <!-- Tailwind CSS 3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              light: '#f8fafc',
              dark: '#020617',
              primary: '#06b6d4',
              primaryHover: '#0891b2',
              secondary: '#0f172a',
              secondaryHover: '#1e293b',
              accent: '#0ea5e9',
              emerald: '#10b981',
              navy: '#0f172a',
            },
            slate: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              855: '#0f172a',
              900: '#090d16',
              950: '#040711',
              955: '#020617',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            outfit: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body
  class="bg-slate-50 text-slate-800 dark:bg-slate-955 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col relative font-sans">

  <!-- Floating Toggles -->
  <div class="absolute top-6 right-6 flex items-center space-x-3 rtl:space-x-reverse z-50">

    <!-- RTL Toggle -->
    <button
      class="rtl-toggle w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors flex items-center justify-center bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm"
      aria-label="Toggle Direction">
      <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
    </button>

    <!-- Theme Toggle -->
    <button
      class="theme-toggle w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors flex items-center justify-center bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm"
      aria-label="Toggle Theme">
      <i data-lucide="sun" class="sun-icon w-5 h-5 hidden"></i>
      <i data-lucide="moon" class="moon-icon w-5 h-5"></i>
    </button>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <main
    class="flex-grow flex items-center justify-center py-20 relative bg-gradient-to-tr from-cyan-950/20 via-slate-955 to-slate-955 min-h-screen">
    <div class="max-w-md w-full mx-auto px-4">
      <div
        class="glass-card p-8 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 text-left ltr:text-left rtl:text-right animate-fade-in-up">

        <div class="flex flex-col items-center mb-8">
          <!-- Brand Logo -->
          <a href="index.html" class="flex items-center space-x-3 rtl:space-x-reverse group mb-6">
            <div
              class="w-11 h-11 rounded-xl bg-gradient-to-tr from-brand-primary to-brand-accent flex items-center justify-center text-slate-955 font-bold shadow-lg shadow-cyan-500/25 group-hover:scale-105 transition-transform duration-300">
              <i data-lucide="shield-check" class="w-6 h-6 text-slate-955"></i>
            </div>
            <span
              class="font-outfit text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white group-hover:text-brand-primary transition-colors">
              Cyber<span class="text-brand-primary">Guard</span>
            </span>
          </a>

          <h1 class="text-2xl font-bold font-outfit text-slate-900 dark:text-white mb-2">Create Policyholder Account</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 text-center">Manage corporate policy documentation, submit claims, and access 24/7 legal counsel.</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('Account registered successfully! Please check your email for policy binder confirmation.');" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Company Legal Name</label>
            <input type="text" required placeholder="e.g. MedTech Systems Inc."
              class="w-full p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-sm font-medium focus:ring-2 focus:ring-brand-primary">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Corporate Email</label>
            <input type="email" required placeholder="name@company.com"
              class="w-full p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-sm font-medium focus:ring-2 focus:ring-brand-primary">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Create Password</label>
            <input type="password" required placeholder="••••••••"
              class="w-full p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-955 text-sm font-medium focus:ring-2 focus:ring-brand-primary">
          </div>

          <div class="flex items-center space-x-2 rtl:space-x-reverse pt-2">
            <input type="checkbox" required id="terms" class="rounded text-brand-primary focus:ring-brand-primary">
            <label for="terms" class="text-xs text-slate-500">I agree to the <a href="#" class="text-cyan-400 underline">Terms of Insurance Brokerage</a></label>
          </div>

          <button type="submit"
            class="w-full py-3.5 rounded-xl bg-brand-primary hover:bg-brand-primaryHover text-slate-955 font-bold text-sm shadow-lg shadow-cyan-500/25 transition-all">
            Register Account
          </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
          Already have an account? <a href="login.html" class="text-cyan-400 font-bold hover:underline">Log In</a>
        </div>

      </div>
    </div>
  </main>

  <!-- ================= SCRIPTS ================= -->
  <script src="assets/js/main.js"></script>
</body>

</html>
